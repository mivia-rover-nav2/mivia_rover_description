# Sensor extrinsics for mivia_rover_description/urdf/mivia_rover_description.urdf.xacro.
#
# Values are in meters / radians. Kept separate from the xacro so they can be
# re-measured/tuned without touching URDF syntax.

# z measured on the rover (flat floor, lid fixed) by fitting the floor plane
# in the Velodyne (303.9 mm) and ZED left camera (176.2 mm) point clouds; the
# two estimates agree within 2 mm (0.1187 / 0.1204), this is their mean. It
# includes the ~16 mm gap between chassis lid and sensor box, which the CAD
# (Rover_Case.step) does not model, so do not derive this value from the CAD.
base_link2sensor_box:
  x: 0.0
  y: 0.0
  z: 0.1195
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

# zed_camera_link is the bottom of the camera body (zed_wrapper puts the
# camera center height/2 = 15 mm above it), not its center.
sensor_box2zed_camera:
  x: 0.1515
  y: 0.0
  z: -0.0359
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

sensor_box2uwb:
  x: 0.1177
  y: -0.0006
  z: 0.0337
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

# Position from the sensor box CAD (Rover_Case_2.step): center of the MTi
# 1-series module on the MTi-8 board. Orientation from a tilt test on the
# rover: sensor +Y points forward, +X to the right, +Z up (yaw -90 deg).
# xsens_mti_node.yaml must keep frame_id == "imu_link" (its default) for
# this to line up.
sensor_box2imu:
  x: 0.0929
  y: -0.0023
  z: -0.0480
  roll: 0.0
  pitch: 0.0
  yaw: -1.5708

# From the sensor box CAD (Rover_Case_2.step): the turret is the VLP-16
# itself, but the turret center is offset by the rear connector bulge.
# Velodyne origin = rotation axis, 37.7 mm above the sensor base (VLP-16
# manual); cable at the rear, so the sensor faces forward (yaw 0).
# velodyne_vlp16.yaml (mivia_rover_sensing_bringup) must keep
# frame_id == "velodyne" for this to line up.
lidar_turret2velodyne:
  x: 0.0060
  y: 0.0
  z: 0.0014
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
